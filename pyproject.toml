
# --- Python package metadata ---
# Identifies this repository when installed into the environment.
[project]
name = "bp2026cl1"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = ["trident @ git+https://github.com/mahmoodlab/TRIDENT.git@adf3b7e8fdd7c815f33bec79da0d8d265200c2d6"]

# --- Python build backend ---
# Setuptools prepares the package for installation, including editable installs.
[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

# --- Pixi environment ---
[tool.pixi.workspace]
name = "bp2026cl1"
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
bp2026cl1 = { path = ".", editable = true }

# --- Development tasks ---
[tool.pixi.tasks]
lint = { cmd = "ruff check .", description = "Check Python code for lint violations." }
lint-fix = { cmd = "ruff check --fix .", description = "Apply safe automatic lint fixes." }
format = { cmd = "ruff format .", description = "Format Python code." }
format-check = { cmd = "ruff format --check .", description = "Check formatting without changes." }
check = { depends-on = ["lint", "format-check"], description = "Run lint and formatting checks." }
# Extra flags are passed through, e.g. `pixi run viewer --rescan` after new slides arrive.
viewer = { cmd = "python notebooks/svs-viewer/app.py", description = "Start the read-only SVS viewer (settings in notebooks/svs-viewer/configs/svs_viewer.toml)." }

attention-viewer = { cmd = "python notebooks/attention-viewer/app.py", description = "Explore Virchow2 CLAM-MB branch attention on whole slides." }

inference = { cmd = "python scripts/inference/predict.py", description = "Score Virchow2 bags with the stored lung/liver champion weights." }
inference-test = { cmd = "python -m unittest discover -s tests -p test_inference.py", description = "Check checkpoint loading and inference." }

[tool.pixi.dependencies]
python = "3.14.*"
ruff = ">=0.17.1,<0.18"
openslide-python = ">=1.4.6,<2"
flask = ">=3.1.3,<4"
pillow = ">=12.3.0,<13"
pandas = ">=3.0.6,<4"
pyarrow = ">=25.0.0,<26"
pypdf = ">=6.21.1,<7"
numpy = ">=2.5.4,<3"
h5py = ">=3.16.0,<4"
pytorch = ">=2.14.1,<3"
torchvision = ">=0.29.1,<0.30"
py-opencv = ">=5.0.0,<6"
scikit-learn = ">=1.9.1,<2"
python-igraph = ">=1.0.0,<2"
umap-learn = ">=0.5.12,<0.6"

# --- Ruff ---
[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E4", "E7", "E9",  # Basic Python style and error checks
    "F",               # Undefined names, unused imports, and related errors
    "I",               # Consistent import sorting
    "B",               # Additional checks for common programming mistakes
]
