<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CHAMPS Data Links</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Layout: one left-to-right chain, a single coverage line underneath. */
  :root {
    --ground: #f5f4f7; --surface: #ffffff; --ink: #1f1d24; --muted: #6c6875; --line: #d9d5e0;
    --accent: #7a3e8f; --accent-soft: #f1e8f4;
    --sans: "IBM Plex Sans", system-ui, sans-serif; --mono: "IBM Plex Mono", ui-monospace, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --ground: #151418; --surface: #1f1d24; --ink: #ecebef; --muted: #a29eab;
      --line: #36333d; --accent: #c792dc; --accent-soft: #2c2231; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --ground: #151418; --surface: #1f1d24; --ink: #ecebef; --muted: #a29eab;
    --line: #36333d; --accent: #c792dc; --accent-soft: #2c2231; color-scheme: dark; }
  body { margin: 0; background: var(--ground); color: var(--ink); font: 15px/1.5 var(--sans);
         padding: 32px max(16px, env(safe-area-inset-right, 0px)) 48px max(16px, env(safe-area-inset-left, 0px)); }
  main { max-width: 1160px; margin: 0 auto; display: grid; gap: 18px; }
  h1 { font-size: 24px; margin: 0; text-wrap: balance; }
  .fig { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px 12px; }
  svg { display: block; min-width: 980px; width: 100%; height: auto; }
  svg text { fill: var(--ink); font-family: var(--sans); font-size: 14px; }
  svg .mono { font-family: var(--mono); font-size: 12.5px; }
  svg .m { fill: var(--muted); font-size: 12.5px; }
  svg .t { font-weight: 600; }
  svg .box { fill: var(--surface); stroke: var(--line); stroke-width: 1.2; }
  svg .hub { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.5; }
  svg .hubt { fill: var(--accent); font-family: var(--mono); font-weight: 500; font-size: 14px; }
  svg .edge { fill: none; stroke: var(--accent); stroke-width: 1.8; }
  svg .arrow { fill: var(--accent); }
  .cov { color: var(--muted); font-size: 14px; margin: 0; }
  .cov b { color: var(--ink); font-variant-numeric: tabular-nums; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>How a slide reaches its case data</h1>

  <div class="fig">
  <svg viewBox="0 0 1120 250" role="img" aria-label="Slide image gives study_id from its folder name; the mapping table converts study_id to champs_deid; champs_deid is the key for the case tables.">
    <defs>
      <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
        <path class="arrow" d="M0,0 L10,5 L0,10 z"/>
      </marker>
    </defs>

    <rect class="box" x="20" y="85" width="170" height="80" rx="8"/>
    <text class="t" x="36" y="114">Slide image</text>
    <text class="m" x="36" y="138">the folder it sits in</text>
    <text class="m" x="36" y="154">is the case ID</text>

    <path class="edge" d="M190,125 L238,125" marker-end="url(#ah)"/>
    <rect class="hub" x="240" y="106" width="130" height="38" rx="19"/>
    <text class="hubt" x="305" y="130" text-anchor="middle">study_id</text>

    <path class="edge" d="M370,125 L418,125" marker-end="url(#ah)"/>
    <rect class="box" x="420" y="85" width="230" height="80" rx="8"/>
    <text class="t" x="436" y="114">Mapping table</text>
    <text class="mono" x="436" y="138">champs_deid_studyid_</text>
    <text class="mono" x="436" y="154">mapping.csv</text>

    <path class="edge" d="M650,125 L698,125" marker-end="url(#ah)"/>
    <rect class="hub" x="700" y="106" width="130" height="38" rx="19"/>
    <text class="hubt" x="765" y="130" text-anchor="middle">champs_deid</text>

    <path class="edge" d="M830,125 L878,125" marker-end="url(#ah)"/>
    <rect class="box" x="880" y="20" width="220" height="210" rx="8"/>
    <text class="t" x="896" y="48">Case tables</text>
    <text x="896" y="78">Demographics</text>
    <text x="896" y="104">Cause of death (DeCoDe)</text>
    <text x="896" y="130">Lab results</text>
    <text x="896" y="156">TAC pathogen results</text>
    <text x="896" y="182">Verbal autopsy</text>
    <text x="896" y="208">CPL pathology reports</text>
  </svg>
  </div>

  <p class="cov">Not every image links through: <b>3,710</b> of 4,262 slide cases appear in the mapping table, and <b>3,614</b> of those have entries in the case tables.</p>
</main>
</body>
</html>
